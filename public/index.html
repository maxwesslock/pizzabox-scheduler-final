<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pizza Box NY — Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="screen-login" class="screen active"></div>
    <div id="screen-pending" class="screen"></div>
    <div id="screen-staff" class="screen"></div>
    <div id="screen-manager" class="screen"></div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
